name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_call:   # lo reutiliza el workflow de CD antes de publicar una versión

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: Validaciones estáticas
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Instalar dependencias
        run: pip install -r requirements-dev.txt
      - name: Linter (ruff)
        run: ruff check . && ruff format --check .
      - name: Análisis estático de seguridad (bandit)
        run: bandit -r app -ll
      - name: Revisión de dependencias vulnerables (pip-audit)
        run: pip-audit -r requirements.txt

  test:
    name: Pruebas automáticas
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Instalar dependencias
        run: pip install -r requirements-dev.txt
      - name: Ejecutar pruebas con cobertura
        run: pytest --cov=app --cov-report=xml --cov-report=term-missing --junitxml=junit.xml
      - name: Publicar reportes
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: reportes-de-pruebas
          path: |
            junit.xml
            coverage.xml

  iac:
    name: Validar infraestructura (Terraform)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: hashicorp/setup-terraform@v3
      - name: terraform fmt
        run: terraform -chdir=infra/terraform fmt -check -recursive
      - name: terraform init (sin backend)
        run: terraform -chdir=infra/terraform init -backend=false
      - name: terraform validate
        run: terraform -chdir=infra/terraform validate

  docker:
    name: Construir imagen
    needs: [lint, test, iac]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Metadatos de la imagen
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=sha,prefix=sha-
            type=raw,value=edge,enable={{is_default_branch}}
      - name: Login en GHCR (solo al integrar en main)
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Construir (y publicar si es main)
        uses: docker/build-push-action@v6
        with:
          context: .
          push: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
