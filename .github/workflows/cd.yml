name: CD

# Se dispara al crear una etiqueta de versión semántica (v1.0.0, v1.1.0, ...)
on:
  push:
    tags: ["v*.*.*"]

permissions:
  contents: read

jobs:
  ci:
    name: Verificar con CI
    uses: ./.github/workflows/ci.yml
    # El workflow reutilizado no puede tener más permisos que los que se le conceden aquí
    permissions:
      contents: read
      packages: write

  release:
    name: Publicar imagen versionada
    needs: ci
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    outputs:
      version: ${{ steps.ver.outputs.version }}
    steps:
      - uses: actions/checkout@v4
      - id: ver
        run: echo "version=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Metadatos
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=latest
      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          build-args: APP_VERSION=${{ steps.ver.outputs.version }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy-staging:
    name: Desplegar en staging (pre-producción)
    needs: release
    runs-on: ubuntu-latest
    # Staging corre en el mismo servidor, en el puerto 8081 (cerrado al público por el Security Group)
    environment: staging
    permissions:
      contents: read
      packages: read
    env:
      VERSION: ${{ needs.release.outputs.version }}
      EC2_HOST: ${{ secrets.EC2_HOST }}
      IMAGE: ghcr.io/${{ github.repository }}
      DB_PASSWORD: ${{ secrets.POSTGRES_PASSWORD }}
      GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      GH_ACTOR: ${{ github.actor }}
    steps:
      - uses: actions/checkout@v4
      - name: Preparar SSH
        env:
          SSH_KEY: ${{ secrets.EC2_SSH_KEY }}
        run: |
          install -m 700 -d ~/.ssh
          printf '%s\n' "$SSH_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh-keyscan -H "$EC2_HOST" >> ~/.ssh/known_hosts
      - name: Desplegar y verificar en staging
        run: scripts/deploy.sh /opt/logiflow-staging 8081

  deploy-production:
    name: Promover a producción
    needs: [release, deploy-staging]
    runs-on: ubuntu-latest
    # Con revisores requeridos en el environment "production" se pide aprobación manual
    permissions:
      contents: read
      packages: read
    environment:
      name: production
    env:
      VERSION: ${{ needs.release.outputs.version }}
      EC2_HOST: ${{ secrets.EC2_HOST }}
      IMAGE: ghcr.io/${{ github.repository }}
      DB_PASSWORD: ${{ secrets.POSTGRES_PASSWORD }}
      GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      GH_ACTOR: ${{ github.actor }}
    steps:
      - uses: actions/checkout@v4
      - name: Preparar SSH
        env:
          SSH_KEY: ${{ secrets.EC2_SSH_KEY }}
        run: |
          install -m 700 -d ~/.ssh
          printf '%s\n' "$SSH_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh-keyscan -H "$EC2_HOST" >> ~/.ssh/known_hosts
      - name: Desplegar y verificar en producción
        run: scripts/deploy.sh /opt/logiflow 80
      - name: Prueba de humo pública (URL funcional)
        run: |
          curl -fsS "http://${EC2_HOST}/health"
          curl -fsS "http://${EC2_HOST}/version" | grep -q "\"${VERSION}\""
